name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - name: capture + compose the bundled demo
        run: screencraft demo --skip-render --out out/demo
      - name: hyperframes check
        run: npx --yes hyperframes check
        working-directory: out/demo/composition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-composition
          path: |
            out/demo/footage/events.json
            out/demo/composition/index.html
